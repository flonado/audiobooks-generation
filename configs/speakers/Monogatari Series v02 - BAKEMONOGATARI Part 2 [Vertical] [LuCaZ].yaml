# Нотатки для книги 2 (чернетка на основі книги 1)
narrator: Araragi
cast:
  Araragi: male, 18, high-school student, narrator ('I'). Sarcastic, banters with
    everyone. Calls Oshino 'Oshino', Hachikuji 'Hachikuji'.
  Hanekawa: female, Araragi's classmate and class president, braids and glasses, kind,
    calm, very smart.
  Senjogahara: female, Hitagi Senjogahara, classmate, cold, sharp-tongued, deadpan,
    long insulting remarks, fragile health, uses a stapler as a weapon.
  Hachikuji: female, Mayoi Hachikuji, around ten years old (an elementary school girl
    with a big backpack), chatty, playful, loves wordplay, deliberately mispronounces
    names (Araragi -> 'Arararagi', 'Araragi-san' -> 'Aragagi'), calls Araragi 'Mr.
    Araragi'.
  Oshino: male, Meme Oshino, middle-aged, Hawaiian shirt, lives in an abandoned cram
    school, expert on oddities, relaxed and ironic, calls Araragi 'Araragi-kun' /
    'Koyomi'.
  Karen: female, Araragi's younger sister, fiery, martial arts, energetic.
  Tsukihi: female, Araragi's youngest sister, calm and sleepy-type, a bit of a trickster.
  Shinobu: female, ancient vampire in the body of a little blonde girl, speaks in
    archaic haughty manner, rarely speaks in this volume.
  Other: any other person (a teacher, a stranger, a shop clerk, a voice in a flashback).
  Kanbaru: female, Suruga Kanbaru, second-year, school star and ace of the girls'
    basketball team, cheerful, very open, speaks formally and excitedly to Araragi,
    calls him 'Mister Araragi'.
  Sengoku: female, Nadeko Sengoku, middle-school girl, shy and quiet, a former classmate
    of Araragi's younger sister.
  Gaen: female, Izuko Gaen, Oshino's senior, an expert on oddities, cheerful and sharp.
  Kagenui: female, Yozuru Kagenui, an expert on oddities, tall and slow-talking.
story: 'Bakemonogatari volume 2: SURUGA MONKEY (Kanbaru, whose arm turned into a monkey''s
  paw, asks for help) and NADEKO SNAKE (Sengoku is cursed by a snake). Narrator is
  still Araragi (male).'
