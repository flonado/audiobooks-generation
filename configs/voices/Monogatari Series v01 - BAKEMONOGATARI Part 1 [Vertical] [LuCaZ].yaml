# Голоси персонажів для озвучення (StyleTTS2). Імена ключів = імена з configs/speakers/<книга>.yaml (cast).
# voice: ім'я голосу зі списку StyleTTS2; speed: темп (1.0 = звичайний); tone: зсув тону в півтонах (+ вище, - нижче;
# через передискретизацію, без луни). Поки цей файл лише зберігає вибір: рушій ще не перемикає голоси за мовцями.
narrator: Araragi          # оповідь від першої особи; голос оповідача = голос цього персонажа

voices:
  Araragi:
    voice: Петро Філяк
    speed: 1.0
    tone: 0
  Senjogahara:
    voice: Поліна Еккерт   # зразок «рівний» (без зсуву тону); клони з аніме вийшли надто грубими
    speed: 1.0
    tone: 0
  Hachikuji:
    voice: Анастасія Павленко   # як у зразку «3 жахлива нога» (весела_фраза_2)
    speed: 1.1
    tone: 1.5
  Hanekawa: null         # ще не вибрано
  Oshino: null
  Karen: null
  Tsukihi: null
  Shinobu: null
  Other: 
    voice: Петро Філяк
    speed: 1.0
    tone: 0
