# Наголоси в іменах і назвах з книги «Коти-вояки» (StyleTTS2). Читається разом з stress_overrides.yaml.
#
# Формат:   Слово: Сло+во     (знак «+» ставиться ПЕРЕД наголошеною голосною)
# Значення нижче — те, що словник розставляє зараз. Перевірте й виправте там, де неправильно.
# Наголос в основі діє на всі відмінкові форми: Вогне+лап → Вогне+лапа, Вогне+лапові, Вогне+лапом...
# Якщо наголос на останньому складі (Руд+ько → Рудьк+о), правило лише для цієї форми — інші форми додайте окремим рядком.
# Слово, якого тут нема, залишиться з автоматичним наголосом; рядок можна видаляти, якщо словник уже правий.

# --- Головні герої та їхні родичі
Вогнелап: Вогнел+ап
Сіролап: Сірол+ап
Синьозірка: Синьоз+ірка
Тигрокіготь: Тигрокіг+оть
Жовтоікла: Жовто+ікла
Рудько: Рудьк+о
Левосерд: Левос+ерд
Круколап: Крукол+ап
Білошторм: Білошт+орм
Пісколапка: Піскол+апка
