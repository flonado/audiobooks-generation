Рудохвіст: Рудохв+іст
Порохолап: Порохол+ап
Темносмуг: Темносм+уг
Зорелом: Зорел+ом
Ляпко: Ляпк+о
Довгохвіст: Довгохв+іст
Дубосерд: Дубос+ерд
Дрібновух: Дрібнов+ух
Ячмінь: Ячм+інь
Морозошубка: Морозош+убка
Мишошубка: Мишош+убка
Одноока: Одно+ока
Верболоза: Вербол+оза
Зорещерб: Зорещ+ерб
Попелюх: Попел+юх
Куцохвіст: Куцохв+іст
Різун: Різ+ун
Генрі: Г+енрі

