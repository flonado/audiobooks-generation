[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobooks"
version = "0.2.0"
description = "Книги -> (переклад) -> озвучення -> .m4b"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

# Рушії мають конфліктні залежності (numpy/torch), тому ставляться в окремі venv.
# Див. README.md: .venv (gemini, m4b), .venv-tts (piper, ukrainian-tts), .venv-styletts, .venv-translate.
[project.optional-dependencies]
gemini = ["google-genai"]
pdf = ["pypdf"]
m4b = ["imageio-ffmpeg"]
piper = ["piper-tts"]
ukrainian-tts = ["ukrainian-tts"]
translate = ["llama-cpp-python"]

[project.scripts]
audiobook = "audiobooks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
